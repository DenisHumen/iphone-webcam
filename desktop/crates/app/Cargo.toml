[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "ClearCam app core — wires transport + session + media pipeline + UI events"

[dependencies]
ccp-protocol = { path = "../ccp-protocol" }
transport = { path = "../transport" }
session = { path = "../session" }
sink = { path = "../sink" }
mediapipeline = { path = "../mediapipeline" }
decode = { path = "../decode" }
adaptive = { path = "../adaptive" }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
qrcode = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
directories = { workspace = true }
toml = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

[features]
test-util = []

[dev-dependencies]
bytes = { workspace = true }
mock-iphone = { path = "../../tools/mock-iphone", package = "mock-iphone" }
tempfile = "3"
tracing-subscriber = { workspace = true }
# Enable test-util feature for the crate itself so integration tests can use
# AppHandle::for_tests_with_pairing without pulling in a circular dependency.
app = { path = ".", features = ["test-util"] }
