[workspace]
resolver = "2"
members = [
    "crates/ccp-protocol",
    "crates/transport",
    "crates/session",
    "crates/adaptive",
    "crates/mediapipeline",
    "crates/decode",
    "crates/sink",
    "crates/app",
]
exclude = ["ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["ClearCam contributors"]
license = "Apache-2.0 OR MIT"
# repository = "..."  # set once published

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
byteorder = "1"
bitflags = { version = "2", features = ["serde"] }
thiserror = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
