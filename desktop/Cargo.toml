[workspace]
resolver = "2"
members = [
    "crates/ccp-protocol",
    "crates/transport",
    "crates/session",
    "crates/adaptive",
    "crates/mediapipeline",
    "crates/decode",
    "crates/sink",
    "crates/app",
    "src-tauri",
    "tools/mock-iphone",
]
exclude = ["ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["ClearCam contributors"]
license = "Apache-2.0 OR MIT"
# repository = "..."  # set once published

[workspace.dependencies]
idevice = { version = "0.1", default-features = false, features = ["usbmuxd", "ring"] }
keyring = "3"
directories = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
byteorder = "1"
bitflags = { version = "2", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
rand = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
